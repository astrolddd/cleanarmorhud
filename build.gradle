plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version '2.+'
	id 'net.darkhax.curseforgegradle' version '1.3.33'
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenLocal()
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation("com.astrolddd.commongui:common-gui:1.0.1") {
		exclude group: "net.fabricmc.fabric-api"
	}
	include "com.astrolddd.commongui:common-gui:1.0.1"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
	mavenLocal()
	maven { url = 'https://maven.terraformersmc.com/releases/' }
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

modrinth {
	token = System.getenv("MODRINTH_TOKEN") ?: project.findProperty("modrinthToken")
	projectId = "SzO1O63Q"
	versionName = project.mod_version
	versionNumber = project.mod_version
	versionType = "release"
	uploadFile = tasks.findByName("remapJar") ?: jar
	gameVersions = (project.findProperty("game_versions") ? project.findProperty("game_versions").split(",")*.trim() : [project.minecraft_version])
	loaders = ["fabric"]
	changelog = "### Changes in 2.1.1:\n- Fixed config screen becoming unusable / overflowing at GUI scales >= 3 (Scale 3, 4, Auto) with dynamic comfortable scale clamping and boundary protection.\n- Automatically restores player's normal in-game GUI scale upon closing config or entering the reposition screen.\n- Added official mod icon in Mod Menu.\n- Updated bundled CommonGUI library."
	dependencies {
		required.project "fabric-api"
		optional.project "modmenu"
	}
}

task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	group = "publishing"
	description = "Uploads mod artifacts to CurseForge."
	apiToken = System.getenv("CURSEFORGE_TOKEN") ?: project.findProperty("curseforge_token") ?: project.findProperty("curseforgeToken")

	def projectId = "1596747"
	def mainFile = upload(projectId, tasks.findByName("remapJar") ?: jar)
	mainFile.displayName = "${project.mod_version}"
	mainFile.releaseType = "release"
	mainFile.changelog = "### Changes in 2.1.1:\n- Fixed config screen becoming unusable / overflowing at GUI scales >= 3 (Scale 3, 4, Auto) with dynamic comfortable scale clamping and boundary protection.\n- Automatically restores player's normal in-game GUI scale upon closing config or entering the reposition screen.\n- Added official mod icon in Mod Menu.\n- Updated bundled CommonGUI library."
	mainFile.changelogType = "markdown"
	mainFile.addRequirement("fabric-api")
	mainFile.addOptional("modmenu")
	mainFile.addGameVersion("26.2")
}
